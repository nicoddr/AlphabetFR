<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alphabet magique ✨</title>
  
  <!-- Chargement de Tailwind CSS pour les styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            if: {
              blue: '#3558a2',
              red: '#E1000F'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Animation de rebond subtil */
    @keyframes subtle-bounce {

      0%,
      100% {
        transform: translateY(-8px);
      }

      50% {
        transform: translateY(0);
      }
    }

    .animate-subtle {
      animation: subtle-bounce 2s infinite ease-in-out;
    }
  </style>
</head>

<body class="min-h-screen bg-white text-if-blue flex flex-col items-center py-4 px-4 font-sans text-center">

  <!-- Espace Header pour logo -->
  <header class="w-full flex flex-col sm:flex-row justify-between items-center sm:items-start mb-6 max-w-5xl">
    <div class="bg-white p-2 text-center sm:text-left">
      <!-- Remplacer le src par le vrai chemin du logo si disponible -->
      <img src="Logo IF.png" alt="Logo Institut français" class="h-14 md:h-20 object-contain mx-auto sm:mx-0"
        onerror="this.outerHTML='<div class=&quot;h-14 w-28 md:h-20 md:w-40 border-2 border-dashed border-gray-400 flex items-center justify-center text-gray-500 text-[10px] md:text-xs text-center mx-auto sm:mx-0&quot;>[Espace Logo]</div>';">
    </div>
    <div class="flex flex-col sm:flex-row items-center gap-2 mt-2 sm:mt-4">
      <div class="text-xs md:text-sm font-medium text-if-blue italic text-center sm:text-right">
        Introduction à la langue française
      </div>
      <!-- Petit sélecteur de langue -->
      <div class="relative inline-block text-left z-50">
        <button id="lang-selector-btn" class="inline-flex items-center justify-between gap-1.5 px-2.5 py-1 rounded-xl border-2 border-if-blue bg-white text-if-blue font-bold text-xs shadow-sm hover:bg-gray-50 focus:outline-none transition-all">
          <span id="selected-lang-label" class="flex items-center gap-1">
            <!-- Rempli par le script -->
          </span>
          <svg class="h-3 w-3 text-if-blue transition-transform duration-200" id="lang-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
        
        <!-- Liste des langues personnalisée avec recherche -->
        <div id="lang-dropdown" class="hidden absolute right-0 mt-1 w-52 bg-white rounded-2xl border-2 border-if-blue shadow-xl p-2 z-50 flex flex-col gap-1.5">
          <input type="text" id="lang-search" placeholder="Rechercher..." class="w-full px-2 py-1 border border-if-blue/30 rounded-xl text-[10px] font-semibold focus:outline-none focus:border-if-blue transition-all bg-white text-if-blue" />
          <div id="lang-dropdown-list" class="max-h-[160px] overflow-y-auto flex flex-col gap-0.5 text-xs scrollbar-thin">
            <!-- Options remplies par le script -->
          </div>
        </div>
      </div>
    </div>
  </header>

  <h1 class="text-3xl md:text-5xl font-extrabold text-if-blue mb-4 drop-shadow-md">
    Alphabet magique ✨
  </h1>
  <p class="text-base md:text-lg text-if-blue mb-6 font-medium">
    Cliquez sur la lettre pour l'écouter !
  </p>

  <!-- Zone d'affichage centrale -->
  <div id="display-area"
    class="h-64 w-full max-w-md bg-white rounded-3xl shadow-xl flex flex-col items-center justify-center mb-10 border-4 border-if-blue transition-all duration-300">
    <div class="text-6xl text-gray-200">
      ❓
    </div>
  </div>

  <!-- Menu de sélection mobile -->
  <div class="block sm:hidden w-full max-w-md mb-8">
    <label for="alphabet-select" class="block text-sm font-bold text-if-blue mb-2 text-left px-2">
      Choisissez une lettre :
    </label>
    <div class="relative">
      <select id="alphabet-select" 
        class="w-full p-4 rounded-2xl border-4 border-if-blue bg-white text-if-blue font-bold text-xl shadow-lg appearance-none focus:ring-4 focus:ring-if-blue/20 outline-none transition-all cursor-pointer">
        <option value="" disabled selected>Choisissez une lettre...</option>
      </select>
      <!-- Custom arrow indicator -->
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-if-blue">
        <svg class="fill-current h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
          <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Grille des lettres -->
  <div id="letters-grid"
    class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-7 gap-2 md:gap-4 max-w-4xl w-full">
    <!-- Les boutons seront insérés ici par le script -->
  </div>

  <!-- Message d'avertissement si le son ne fonctionne pas -->
  <p id="warning" class="hidden mt-8 text-red-500 font-bold bg-white p-4 rounded-lg">
    Attention : L'audio ne fonctionne pas sur votre navigateur. Veuillez utiliser un navigateur plus récent comme Chrome ou Safari.
  </p>

  <!-- Footer avec réseaux sociaux -->

    <div class="flex space-x-6 mb-4">
      <!-- LinkedIn -->

        class="text-if-blue hover:text-if-red transition-colors" title="LinkedIn">
        <svg class="h-7 w-7" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
        </svg>
      </a>
    </div>
    <div class="text-sm font-medium text-gray-500">
      &copy; Nicolas DIDIER. Tous droits réservés.

    // Vibrant colors for the grid letters
    const letterColors = [
      'bg-red-400', 'bg-blue-400', 'bg-green-400', 'bg-yellow-400', 'bg-purple-400',
      'bg-pink-400', 'bg-orange-400', 'bg-teal-400', 'bg-indigo-400', 'bg-red-500',
      'bg-blue-500', 'bg-green-500', 'bg-yellow-500', 'bg-purple-500', 'bg-pink-500',
      'bg-orange-500', 'bg-teal-500', 'bg-indigo-500'
    ];

    let currentLanguageKey = 'anglais'; // Default language
    let isReady = false;
    let isUnlocked = false;
    let preferredVoice = null;

    // Chercher et sélectionner la voix la plus naturelle disponible
    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      const frenchVoices = voices.filter(v => v.lang.startsWith('fr-') || v.lang === 'fr-FR');

      if (frenchVoices.length > 0) {
        preferredVoice = frenchVoices.find(v => v.name.includes('Google')) ||
          frenchVoices.find(v => v.name.includes('Premium')) ||
          frenchVoices.find(v => v.name.includes('Natural')) ||
          frenchVoices.find(v => v.name.includes('Thomas')) ||
          frenchVoices[0];
      }
    }

    // Fonction pour "déverrouiller" l'audio sur mobile
    function unlockAudio() {
      if (isReady && !isUnlocked) {
        isUnlocked = true;
        const silent = new SpeechSynthesisUtterance(" ");
        silent.volume = 0;
        window.speechSynthesis.speak(silent);
        
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('mousedown', unlockAudio);
        window.removeEventListener('click', unlockAudio);
        console.log("Audio unlocked");
      }
    }

    // Initialisation
    window.onload = () => {
      if ('speechSynthesis' in window) {
        isReady = true;
        loadVoices();
        
        if (speechSynthesis.onvoiceschanged !== undefined) {
          speechSynthesis.onvoiceschanged = loadVoices;
        }

        window.addEventListener('touchstart', unlockAudio, { passive: true });
        window.addEventListener('mousedown', unlockAudio);
        window.addEventListener('click', unlockAudio);
      } else {
        document.getElementById('warning').classList.remove('hidden');
      }

      setupLanguageSelector();
      setLanguage(currentLanguageKey);
    };

    // Configuration du sélecteur de langue customisé
    function setupLanguageSelector() {
      const btn = document.getElementById('lang-selector-btn');
      const dropdown = document.getElementById('lang-dropdown');
      const list = document.getElementById('lang-dropdown-list');
      const arrow = document.getElementById('lang-arrow');
      const search = document.getElementById('lang-search');

      // Toggle dropdown
      btn.onclick = (e) => {
        e.stopPropagation();
        const isHidden = dropdown.classList.contains('hidden');
        if (isHidden) {
          dropdown.classList.remove('hidden');
          arrow.classList.add('rotate-180');
          search.value = '';
          filterLanguages('');
          setTimeout(() => search.focus(), 50); // Focus avec léger délai
        } else {
          dropdown.classList.add('hidden');
          arrow.classList.remove('rotate-180');
        }
      };

      // Close dropdown when clicking outside
      window.onclick = () => {
        dropdown.classList.add('hidden');
        arrow.classList.remove('rotate-180');
      };

      // Stop propagation inside dropdown clicks to prevent closing
      dropdown.onclick = (e) => {
        e.stopPropagation();
      };

      // Listen for search input
      search.oninput = (e) => {
        filterLanguages(e.target.value);
      };

      // Populate dropdown options
      list.innerHTML = '';
      Object.keys(languagesData).sort().forEach(key => {
        const lang = languagesData[key];
        const item = document.createElement('button');
        item.className = "flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-if-blue/10 text-if-blue font-semibold text-left transition-colors w-full text-xs lang-option-btn";
        item.dataset.name = lang.name.toLowerCase();
        item.innerHTML = `<span class="text-base">${lang.flag}</span> <span>${lang.name}</span>`;
        item.onclick = (e) => {
          e.stopPropagation();
          setLanguage(key);
          dropdown.classList.add('hidden');
          arrow.classList.remove('rotate-180');
        };
        list.appendChild(item);
      });
    }

    // Filtrer la liste des langues
    function filterLanguages(query) {
      const q = query.toLowerCase().trim();
      const list = document.getElementById('lang-dropdown-list');
      const buttons = list.getElementsByClassName('lang-option-btn');
      for (let btn of buttons) {
        const name = btn.dataset.name;
        if (name.includes(q)) {
          btn.style.display = 'flex';
        } else {
          btn.style.display = 'none';
        }
      }
    }

    // Changer de langue active
    function setLanguage(key) {
      currentLanguageKey = key;
      const lang = languagesData[key];
      
      // Mettre à jour le bouton de sélection
      document.getElementById('selected-lang-label').innerHTML = `
        <span class="text-2xl">${lang.flag}</span>
        <span>${lang.name}</span>
      `;

      // Réinitialiser la zone d'affichage
      const displayArea = document.getElementById('display-area');
      displayArea.innerHTML = `
        <div class="text-6xl text-gray-200">
          ❓
        </div>
      `;

      // Regénérer la grille et le sélecteur mobile
      renderGrid();
    }

    // Garsas ir ekrano atnaujinimas
    function playSound(index) {
      const alphabet = languagesData[currentLanguageKey].alphabet;
      const item = alphabet[index];
      const displayArea = document.getElementById('display-area');

      // Atnaujinti centrinę sritį (sans prononciation)
      displayArea.innerHTML = `
        <div class="animate-subtle flex flex-col items-center p-4">
          <div class="text-7xl mb-2">${item.emoji}</div>
          <div class="text-5xl font-black text-if-blue mb-1">${item.letter}</div>
          <div class="text-3xl font-bold text-if-blue capitalize">${item.word}</div>
          <div class="text-xl font-medium text-gray-500 italic mt-1">${item.translation}</div>
        </div>
      `;

      // Paleisti garsą prancūzų kalba
      if (isReady) {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
        }

        const textToSpeak = item.letter.toLowerCase();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);

        utterance.lang = 'fr-FR';
        utterance.rate = 0.85;
        utterance.pitch = 1.0;

        if (preferredVoice) {
          utterance.voice = preferredVoice;
        }

        window.speechSynthesis.speak(utterance);
      }
    }

    // Sugeneruoti mygtukus ir dropdown
    function renderGrid() {
      const grid = document.getElementById('letters-grid');
      const select = document.getElementById('alphabet-select');
      const alphabet = languagesData[currentLanguageKey].alphabet;

      // Nettoyer la grille et le select
      grid.innerHTML = '';
      select.innerHTML = '<option value="" disabled selected>Choisissez une lettre...</option>';

      alphabet.forEach((item, index) => {
        // Déterminer la couleur
        const colorClass = letterColors[index % letterColors.length];

        // Grid mygtukai
        const btn = document.createElement('button');
        btn.className = `${colorClass} text-white font-black text-2xl md:text-4xl h-14 md:h-20 rounded-xl md:rounded-2xl shadow-md transform transition-transform duration-200 hover:scale-110 active:scale-95 flex items-center justify-center border-b-4 border-black/20`;
        btn.innerText = item.letter;
        btn.onclick = () => playSound(index);
        grid.appendChild(btn);

        // Dropdown parinktys
        const option = document.createElement('option');
        option.value = index;
        option.innerText = `${item.letter} - ${item.word}`;
        select.appendChild(option);
      });

      // Dropdown pasikeitimo klausiklis
      select.onchange = (e) => {
        if (e.target.value !== "") {
          playSound(parseInt(e.target.value));
        }
      };
    }
  </script>
